<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYP Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
        <h1>SYP Admin</h1>
        <p class="login-subtitle">School Photography Platform</p>
      </div>
      <form id="login-form" onsubmit="return false;">
        <div class="form-group">
          <label for="login-password">Admin Password</label>
          <input type="password" id="login-password" placeholder="Enter admin password" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app-shell hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
        <span>SYP Admin</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Nav items rendered by JS -->
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-logout" id="logout-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <path d="M21 12H9"/>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Mobile Hamburger -->
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle sidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header" id="content-header">
        <!-- Rendered by JS: title + breadcrumb -->
      </header>
      <div class="content-body" id="content-body">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card" id="modal-card">
      <!-- Rendered by JS -->
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="admin.js"></script>
</body>
</html>
