<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access My Event — V2 Preview</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#f6f7f9; --card:#fff; --ink:#111; --muted:#6b7280; --accent:#0ea5e9; --border:#e6e7eb; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif; }
    .container{ max-width:980px; margin:40px auto; padding:0 16px; }
    .brand{ display:flex; align-items:center; gap:12px; margin-bottom:16px;}
    .brand .dot{ width:14px; height:14px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px rgba(14,165,233,.35); }
    h1{ font-size:clamp(22px,3vw,28px); margin:0; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    .muted{ color:var(--muted); }
    .row{ display:flex; gap:12px; margin:10px 0 20px; }
    input{ flex:1; padding:12px 14px; border:1px solid var(--border); border-radius:12px; font-size:16px; }
    button{ background:var(--accent); color:#fff; border:0; padding:12px 16px; border-radius:12px; font-weight:600; cursor:pointer; }
    .secondary{ display:inline-block; padding:12px 16px; border-radius:12px; border:1px solid var(--border); text-decoration:none; color:var(--ink); }
    .error{ color:#b91c1c; }
    .student-bar{ display:flex; align-items:center; justify-content:space-between; margin:10px 0 12px; flex-wrap:wrap; gap:8px; }
    .gallery img{ width:100%; height:auto; border-radius:14px; border:1px solid var(--border); }
    .actions{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; }
    .footnote{ margin-top:10px; font-size:.9rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand"><span class="dot"></span><h1>Access My Event — V2 Preview</h1></div>
    <section id="access-app" class="card">
      <p class="muted">Enter the 6-character code from your message to view your student's photo.</p>

      <form id="code-form" class="row">
        <input id="code-input" inputmode="latin" autocomplete="one-time-code"
               pattern="[A-Za-z0-9]{5,8}" maxlength="8"
               placeholder="Enter your code (e.g., YIF9RN)" required />
        <button type="submit">View Photos</button>
      </form>

      <p id="error" class="error" hidden></p>

      <div id="result" hidden>
        <div class="student-bar">
          <strong id="student-name"></strong>
          <span class="muted" id="student-meta"></span>
        </div>

        <div class="gallery">
          <img id="hero" alt="Your photo" />
        </div>

        <div class="actions">
          <button id="download-btn">Free Social Download</button>
          <a id="order-link" class="secondary" href="/order.html">Order Prints & Full‑Res</a>
        </div>

        <p id="claim-note" class="footnote"></p>
      </div>
    </section>
  </div>

  <script type="module" src="/assets/js/access.js"></script>
</body>
</html>
